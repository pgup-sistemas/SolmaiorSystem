<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sol Maior</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        .login-header {
            background: linear-gradient(135deg, #008bcd 0%, #006fa3 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #008bcd;
            box-shadow: 0 0 0 3px rgba(0, 139, 205, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #008bcd 0%, #006fa3 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 139, 205, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            font-size: 13px;
            color: #9ca3af;
            position: relative;
        }

        .signup-section {
            text-align: center;
        }

        .signup-section p {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .signup-section a {
            color: #008bcd;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-section a:hover {
            color: #006fa3;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border-left: 4px solid #dc3545;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border-left: 4px solid #28a745;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-body {
                padding: 30px 20px;
            }

            .logo {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-music"></i>
                </div>
                <h1>Sol Maior</h1>
                <p>Criar Nova Conta</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="{% if category == 'error' %}error-message{% else %}success-message{% endif %}">
                                <i class="fas fa-{% if category == 'error' %}exclamation-circle{% else %}check-circle{% endif %} mr-2"></i>
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Register Form -->
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="full_name">
                            <i class="fas fa-user mr-2" style="color: #008bcd;"></i>Nome Completo
                        </label>
                        <input type="text" id="full_name" name="full_name" placeholder="Seu nome completo" required
                               autofocus>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope mr-2" style="color: #008bcd;"></i>Email
                        </label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">
                            <i class="fas fa-phone mr-2" style="color: #008bcd;"></i>Telefone
                        </label>
                        <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000">
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock mr-2" style="color: #008bcd;"></i>Senha
                        </label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="btn-login">
                        <i class="fas fa-user-plus mr-2"></i>Criar Conta
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider">
                    <span>Já tem uma conta?</span>
                </div>

                <!-- Login Section -->
                <div class="signup-section">
                    <a href="{{ url_for('auth.login') }}">
                        <i class="fas fa-sign-in-alt mr-1"></i>Faça login aqui
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div style="text-align: center; margin-top: 30px; color: #6b7280; font-size: 12px;">
            <p>&copy; 2025 Sol Maior. Todos os direitos reservados.</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/components.js') }}"></script>
</body>
</html>

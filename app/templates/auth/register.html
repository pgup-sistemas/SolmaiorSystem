{% extends "base.html" %}

{% block title %}Cadastro - Solmaior{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8">
        <h2 class="text-3xl font-bold text-center mb-8">
            <i class="fas fa-user-plus text-blue-600"></i> Cadastro
        </h2>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-4">
                <label for="full_name" class="block text-gray-700 font-semibold mb-2">
                    <i class="fas fa-user mr-1"></i> Nome Completo
                </label>
                <input type="text" id="full_name" name="full_name" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2">
                    <i class="fas fa-envelope mr-1"></i> Email
                </label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="mb-4">
                <label for="phone" class="block text-gray-700 font-semibold mb-2">
                    <i class="fas fa-phone mr-1"></i> Telefone
                </label>
                <input type="tel" id="phone" name="phone"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="mb-6">
                <label for="password" class="block text-gray-700 font-semibold mb-2">
                    <i class="fas fa-lock mr-1"></i> Senha
                </label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                <i class="fas fa-user-plus mr-2"></i>Criar Conta
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-600">
                Já tem uma conta?
                <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:text-blue-800 font-semibold">
                    Faça login aqui
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

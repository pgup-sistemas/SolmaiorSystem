{% extends "base.html" %}

{% block title %}Criar Sala - Solmaior{% endblock %}

{% block content %}
<div class="bg-blue-600 text-white py-8">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold">
            <i class="fas fa-door-open mr-2"></i>Criar Nova Sala
        </h1>
    </div>
</div>

<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
        <form method="POST" action="{{ url_for('admin.create_room') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Nome da Sala</label>
                    <input type="text" name="name" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Capacidade</label>
                    <input type="number" name="capacity" value="1" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Equipamento</label>
                    <textarea name="equipment" rows="4"
                              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
            </div>
            
            <div class="mt-8 flex gap-4">
                <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Criar Sala
                </button>
                <a href="{{ url_for('admin.rooms') }}" 
                   class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

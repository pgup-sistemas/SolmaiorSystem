{% extends "base.html" %}

{% block title %}Criar Recital - Sol Maior{% endblock %}

{% block content %}
<div class="bg-blue-600 text-white py-8">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold">
            <i class="fas fa-calendar-plus mr-2"></i>Criar Novo Recital
        </h1>
        <nav class="text-sm mt-2 opacity-90">
            <a href="{{ url_for('public.index') }}" class="hover:underline">Início</a>
            <span class="mx-2">/</span>
            <a href="{{ url_for('admin.dashboard') }}" class="hover:underline">Painel Admin</a>
            <span class="mx-2">/</span>
            <a href="{{ url_for('admin.recitals') }}" class="hover:underline">Recitais</a>
            <span class="mx-2">/</span>
            <span>Criar</span>
        </nav>
    </div>
</div>

<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
        <form method="POST" action="{{ url_for('admin.create_recital') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Título do Evento</label>
                    <input type="text" name="title" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Descrição</label>
                    <textarea name="description" rows="4"
                              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Data e Hora</label>
                    <input type="datetime-local" name="event_date" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Local</label>
                    <input type="text" name="location"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div class="mt-8 flex gap-4">
                <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Criar Recital
                </button>
                <a href="{{ url_for('admin.recitals') }}" 
                   class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

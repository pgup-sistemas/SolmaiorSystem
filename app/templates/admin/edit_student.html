
{% extends "base.html" %}

{% block title %}Editar Aluno - Solmaior{% endblock %}

{% block content %}
<div class="bg-blue-600 text-white py-8">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold">
            <i class="fas fa-user-graduate mr-2"></i>Editar Dados do Aluno
        </h1>
        <p class="mt-2">{{ student.user.full_name }}</p>
    </div>
</div>

<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow p-8">
        <form method="POST" action="{{ url_for('admin.edit_student', id=student.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <!-- Informações do Curso -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-4 text-blue-600">Informações do Curso</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Instrumento</label>
                        <input type="text" name="instrument" value="{{ student.instrument }}" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Nível</label>
                        <select name="level" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="Iniciante" {% if student.level == 'Iniciante' %}selected{% endif %}>Iniciante</option>
                            <option value="Básico" {% if student.level == 'Básico' %}selected{% endif %}>Básico</option>
                            <option value="Intermediário" {% if student.level == 'Intermediário' %}selected{% endif %}>Intermediário</option>
                            <option value="Avançado" {% if student.level == 'Avançado' %}selected{% endif %}>Avançado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Modalidade</label>
                        <select name="course_modality" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="Individual" {% if student.course_modality == 'Individual' %}selected{% endif %}>Individual</option>
                            <option value="Grupo" {% if student.course_modality == 'Grupo' %}selected{% endif %}>Grupo</option>
                            <option value="Online" {% if student.course_modality == 'Online' %}selected{% endif %}>Online</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Aulas por Semana</label>
                        <input type="number" name="weekly_lessons" value="{{ student.weekly_lessons or 1 }}" min="1"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Duração (min)</label>
                        <input type="number" name="lesson_duration" value="{{ student.lesson_duration or 60 }}" min="30"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Horário Preferido</label>
                        <input type="text" name="preferred_schedule" value="{{ student.preferred_schedule or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>
            
            <!-- Dados Pessoais -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-4 text-blue-600">Dados Pessoais</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Data de Nascimento</label>
                        <input type="date" name="birth_date" value="{{ student.birth_date.strftime('%Y-%m-%d') if student.birth_date else '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">CPF</label>
                        <input type="text" name="cpf" value="{{ student.cpf or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">RG</label>
                        <input type="text" name="rg" value="{{ student.rg or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-gray-700 font-semibold mb-2">Endereço</label>
                        <input type="text" name="address" value="{{ student.address or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Cidade</label>
                        <input type="text" name="city" value="{{ student.city or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Estado</label>
                        <input type="text" name="state" value="{{ student.state or '' }}" maxlength="2"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">CEP</label>
                        <input type="text" name="zip_code" value="{{ student.zip_code or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>
            
            <!-- Dados do Responsável -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-4 text-blue-600">Dados do Responsável</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Nome do Responsável</label>
                        <input type="text" name="guardian_name" value="{{ student.guardian_name or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Telefone do Responsável</label>
                        <input type="tel" name="guardian_phone" value="{{ student.guardian_phone or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Email do Responsável</label>
                        <input type="email" name="guardian_email" value="{{ student.guardian_email or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">CPF do Responsável</label>
                        <input type="text" name="guardian_cpf" value="{{ student.guardian_cpf or '' }}"
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>
            
            <!-- Informações Adicionais -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold mb-4 text-blue-600">Informações Adicionais</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Informações Médicas</label>
                        <textarea name="medical_info" rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ student.medical_info or '' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Necessidades Especiais</label>
                        <textarea name="special_needs" rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ student.special_needs or '' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Experiência Anterior</label>
                        <textarea name="previous_experience" rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ student.previous_experience or '' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Objetivos</label>
                        <textarea name="goals" rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ student.goals or '' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">Observações</label>
                        <textarea name="notes" rows="3"
                                  class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ student.notes or '' }}</textarea>
                    </div>
                </div>
            </div>
            
            <div class="mt-8 flex gap-4">
                <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Salvar Alterações
                </button>
                <a href="{{ url_for('admin.users') }}" 
                   class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

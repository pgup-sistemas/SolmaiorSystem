
{% extends "base.html" %}

{% block title %}Editar Notícia - Solmaior{% endblock %}

{% block content %}
<div class="bg-blue-600 text-white py-8">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold">
            <i class="fas fa-edit mr-2"></i>Editar Notícia
        </h1>
    </div>
</div>

<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
        <form method="POST" action="{{ url_for('admin.edit_news', id=post.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Título</label>
                    <input type="text" name="title" value="{{ post.title }}" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Conteúdo</label>
                    <textarea name="content" rows="10" required
                              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">{{ post.content }}</textarea>
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Tipo</label>
                    <select name="post_type"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="news" {% if post.post_type == 'news' %}selected{% endif %}>Notícia</option>
                        <option value="event" {% if post.post_type == 'event' %}selected{% endif %}>Evento</option>
                        <option value="announcement" {% if post.post_type == 'announcement' %}selected{% endif %}>Aviso</option>
                    </select>
                </div>
                
                <div>
                    <label class="flex items-center">
                        <input type="checkbox" name="is_published" class="mr-2" {% if post.is_published %}checked{% endif %}>
                        <span class="text-gray-700">Publicado</span>
                    </label>
                </div>
            </div>
            
            <div class="mt-8 flex gap-4">
                <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Salvar Alterações
                </button>
                <a href="{{ url_for('admin.news') }}" 
                   class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

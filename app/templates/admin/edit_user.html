
{% extends "base.html" %}

{% block title %}Editar Usuário - Solmaior{% endblock %}

{% block content %}
<div class="bg-blue-600 text-white py-8">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl font-bold">
            <i class="fas fa-user-edit mr-2"></i>Editar Usuário
        </h1>
        <nav class="text-sm mt-2 opacity-90">
            <a href="{{ url_for('public.index') }}" class="hover:underline">Início</a>
            <span class="mx-2">/</span>
            <a href="{{ url_for('admin.dashboard') }}" class="hover:underline">Painel Admin</a>
            <span class="mx-2">/</span>
            <a href="{{ url_for('admin.users') }}" class="hover:underline">Usuários</a>
            <span class="mx-2">/</span>
            <span>Editar</span>
        </nav>
    </div>
</div>

<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
        <form method="POST" action="{{ url_for('admin.edit_user', id=user.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Nome Completo</label>
                    <input type="text" name="full_name" value="{{ user.full_name }}" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Telefone</label>
                    <input type="tel" name="phone" value="{{ user.phone or '' }}"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-gray-700 font-semibold mb-2">Papel</label>
                    <input type="text" value="{{ user.role }}" disabled
                           class="w-full px-4 py-2 border rounded-lg bg-gray-100">
                    <p class="text-xs text-gray-500 mt-1">O papel não pode ser alterado</p>
                </div>
                
                <div class="md:col-span-2">
                    <label class="block text-gray-700 font-semibold mb-2">Nova Senha (deixe em branco para manter)</label>
                    <input type="password" name="password"
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div class="md:col-span-2">
                    <label class="flex items-center">
                        <input type="checkbox" name="is_active" class="mr-2" {% if user.is_active %}checked{% endif %}>
                        <span class="text-gray-700">Usuário ativo</span>
                    </label>
                </div>
            </div>
            
            <div class="mt-8 flex gap-4">
                <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                    <i class="fas fa-save mr-2"></i>Salvar Alterações
                </button>
                <a href="{{ url_for('admin.users') }}" 
                   class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
